name: Nightly unit tests

on:
  schedule:
    # 03:00 UTC daily (~04:00 Europe/Berlin in winter, 05:00 in summer)
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-unit
  cancel-in-progress: false

jobs:
  client:
    name: "Client lint, typecheck & unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:src

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  server:
    name: "Server typecheck & unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck
        env:
          # tsc on this package has OOMed at the default ~2GB heap on GHA runners
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests
        run: npx jest --testPathPatterns=test-unit
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci

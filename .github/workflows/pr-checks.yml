name: PR checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:src

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  server:
    name: Server typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # postinstall runs prisma generate; URL is unused for generate
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx jest --testPathPatterns=test-unit
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci
